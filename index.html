<!DOCTYPE html>
<html lang="en">

<!-- Head starts -->
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Link custom css -->
    <link rel="stylesheet" href="css/styles.css">

</head>
<!-- Head ends -->

<!-- Body starts -->
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-8 col-md-5">

                <!-- Main heading  -->
                <div class="text-center mb-4">
                    <h1 class="text-white fw-bold">Simple Calculator</h1>
                </div>

                <div class="calculator-card shadow-lg p-3">
                    <input type="text" id="display" class="form-control mb-3 text-end" placeholder="0" readonly>

                    <!-- Operators and operands in calculator -->
                    <div class="row g-2">
                        <div class="col-6"><button class="btn btn-info w-100 calc-btn" data-val="AC">AC</button></div>
                        <div class="col-6"><button class="btn btn-info w-100 calc-btn" data-val="CLR">&#x232B;</button>
                        </div>

                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn"
                                data-val="sq">x&sup2;</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn"
                                data-val="cu">x&sup3;</button></div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn" data-val="%">%</button>
                        </div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn"
                                data-val="/">&divide;</button></div>

                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="7">7</button>
                        </div>
                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="8">8</button>
                        </div>
                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="9">9</button>
                        </div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn"
                                data-val="*">&times;</button></div>

                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="4">4</button>
                        </div>
                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="5">5</button>
                        </div>
                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="6">6</button>
                        </div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn"
                                data-val="-">&minus;</button></div>

                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="1">1</button>
                        </div>
                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="2">2</button>
                        </div>
                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val="3">3</button>
                        </div>
                        <div class="col-3"><button class="btn btn-secondary w-100 calc-btn" data-val="+">+</button>
                        </div>

                        <div class="col-6"><button class="btn btn-light border w-100 calc-btn" data-val="0">0</button>
                        </div>
                        <div class="col-3"><button class="btn btn-light border w-100 calc-btn" data-val=".">.</button>
                        </div>
                        <div class="col-3"><button class="btn btn-primary w-100 calc-btn" data-val="=">=</button></div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
        crossorigin="anonymous"></script>

    <!-- Link JavaScript -->
    <script src="js/scripts.js"></script>

</body>
<!-- Body ends -->

</html>
