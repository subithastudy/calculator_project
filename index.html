<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<!-- Body starts -->
<body>

    <div class="container">
        <h2>Simple Calculator</h2>

        <!-- Input boxes for accepting two numbers from user -->
        <input type="number" id="num1" placeholder="Enter first number">
        <input type="number" id="num2" placeholder="Enter second number">

        <!-- Buttons for addition. subtraction, multiplication, division -->
        <div class="buttons">
            <button id="addBtn">+</button>
            <button id="subBtn">-</button>
            <button id="mulBtn">*</button>
            <button id="divBtn">/</button>
        </div>

        <!-- Buttons for calculating square and cube -->
        <div class="buttons">
            <button id="squareBtn">x<sup>2</sub></button>
            <button id="cubeBtn">x<sup>3</sub></button>
        </div>

        <!-- Displaying result -->
        <h3 id="result">Result : </h3>
    </div>

    <!-- Link external JavaScript file -->
    <script src="js/scripts.js"></script>

</body>
<!-- Body ends -->

</html>
